name: V0.9 B2 Formal Source Export

on:
  push:
    branches:
      - v0.9-b2/authority-effect-evidence

permissions:
  contents: read

env:
  ACCEPTED_V08_BASE: e8c53d4a2d6d6ce1d57a34472170c01577e15d6c
  SPECULATIVE_BASE: b65a51267969824c05a8794376eac766edc08eb9
  SPEC_COMMIT_1: abaa693ad3c0aea4b655d4caca8c73680ae7d934
  SPEC_SOURCE: ed15bd2a6fa094bc295ed37bee4a0fa07e063e75
  FORMAL_BRANCH: v0.9-b2/authority-effect-evidence
  CORRECTION_PARENT: 41b6984196cf62a3dea5973d6d77f5e280070857
  BOOTSTRAP_REPLAY_SOURCE: 14578beb227e36c31db6cd3421fcb62a081f6368

jobs:
  build-validate-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout formal branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exporter ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${CORRECTION_PARENT}"
          git merge-base --is-ancestor "${ACCEPTED_V08_BASE}" HEAD
          if git merge-base --is-ancestor "${SPECULATIVE_BASE}" HEAD; then
            echo "SPECULATIVE_ANCESTRY_FORBIDDEN"
            exit 1
          fi

      - name: Rebuild equivalent four-path formal source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess, textwrap
          from pathlib import Path
          parent = "14578beb227e36c31db6cd3421fcb62a081f6368"
          path = ".github/workflows/v09-authority-effect-verify.yml"
          text = subprocess.check_output(["git", "show", f"{parent}:{path}"], text=True)
          marker = "      - name: Replay final B2 patch and formalize metadata\n        shell: bash\n        run: |\n"
          end_marker = "\n      - name: Compile all runtime on local formal candidate"
          start = text.find(marker)
          if start < 0:
              raise SystemExit("PARENT_REPLAY_STEP_MISSING")
          start += len(marker)
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("PARENT_REPLAY_STEP_END_MISSING")
          Path("/tmp/v09-replay.sh").write_text("set -euo pipefail\n" + textwrap.dedent(text[start:end]), encoding="utf-8")
          PY
          bash /tmp/v09-replay.sh

          cat > .github/workflows/v09-authority-effect-verify.yml <<'YAML'
          name: V0.9 Authority Effect Formal RED Evidence

          on:
            push:
              branches:
                - v0.9-b2/authority-effect-evidence
            workflow_dispatch:

          permissions:
            contents: read

          env:
            ACCEPTED_V08_BASE: e8c53d4a2d6d6ce1d57a34472170c01577e15d6c
            SPECULATIVE_BASE: b65a51267969824c05a8794376eac766edc08eb9

          jobs:
            offline-formal-red-evidence:
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"
                - name: Verify ancestry and ownership
                  shell: bash
                  run: |
                    set -euo pipefail
                    git merge-base --is-ancestor "${ACCEPTED_V08_BASE}" HEAD
                    if git merge-base --is-ancestor "${SPECULATIVE_BASE}" HEAD; then exit 1; fi
                    python - <<'PY'
                    import os, subprocess
                    allowed={".github/workflows/v09-authority-effect-verify.yml","runtime/fixtures/v09_authority_effect_attack_cases.json","runtime/test_v09_attack_matrix_offline.py","runtime/v09_authority_effect_evidence.py"}
                    changed={x for x in subprocess.check_output(["git","diff","--name-only",f"{os.environ['ACCEPTED_V08_BASE']}..HEAD"],text=True).splitlines() if x}
                    if changed != allowed: raise SystemExit(f"B2_FORMAL_OWNERSHIP_MISMATCH:{sorted(changed)}")
                    PY
                - name: Compile all runtime
                  run: python -m compileall -q runtime
                - name: Diff check
                  run: git diff --check "${ACCEPTED_V08_BASE}..HEAD"
                - name: Execute exact B2 matrix command
                  continue-on-error: true
                  run: python runtime/test_v09_attack_matrix_offline.py
                - name: Collect formal results
                  run: |
                    mkdir -p v09-evidence
                    python runtime/test_v09_attack_matrix_offline.py --emit-jsonl v09-evidence/v09-attack-results.jsonl
                - name: Generate formal Evidence
                  continue-on-error: true
                  shell: bash
                  run: |
                    python runtime/v09_authority_effect_evidence.py --base-sha "${ACCEPTED_V08_BASE}" --candidate-sha "$(git rev-parse HEAD)" --output v09-evidence/v09-authority-effect-evidence.json
                - name: Validate formal RED baseline
                  shell: bash
                  run: |
                    python - <<'PY'
                    import json, os, subprocess
                    from pathlib import Path
                    ids=[f"V09-R{i:02d}" for i in range(1,37)]
                    reds=["V09-R01","V09-R04","V09-R06","V09-R08","V09-R09","V09-R13","V09-R18","V09-R20","V09-R21","V09-R22","V09-R23","V09-R24","V09-R26","V09-R32","V09-R34","V09-R36"]
                    m=json.loads(Path("runtime/fixtures/v09_authority_effect_attack_cases.json").read_text(encoding="utf-8"))
                    cases=m.get("cases") or []
                    if m.get("attack_matrix_version")!="V09-AUTHORITY-EFFECT-ATTACK-MATRIX-1" or m.get("attack_case_count")!=36 or [c.get("id") for c in cases]!=ids or len({c.get("id") for c in cases})!=36: raise SystemExit("MATRIX_INTEGRITY_FAIL")
                    by={c["id"]:c for c in cases}
                    rows=[json.loads(x) for x in Path("v09-evidence/v09-attack-results.jsonl").read_text(encoding="utf-8").splitlines() if x]
                    if [r.get("test_id") for r in rows]!=ids or len(rows)!=36: raise SystemExit("RESULT_ID_SET_FAIL")
                    for r in rows:
                      c=by[r["test_id"]]
                      if r.get("executed") is not True or r.get("owner")!=c.get("owner") or r.get("owner_case")!=c.get("owner_case") or r.get("expected_outcome")!=c.get("expected_outcome"): raise SystemExit(f"RESULT_BINDING_FAIL:{r['test_id']}")
                      o=r.get("observed_outcome")
                      if not isinstance(o,str) or not o or r.get("matched") is not (o==c.get("expected_outcome")): raise SystemExit(f"RESULT_OBSERVATION_FAIL:{r['test_id']}")
                    actual=[r["test_id"] for r in rows if r.get("matched") is not True]
                    if actual!=reds: raise SystemExit(f"RED_BASELINE_FAIL:{actual}")
                    e=json.loads(Path("v09-evidence/v09-authority-effect-evidence.json").read_text(encoding="utf-8"))
                    if e.get("accepted_v08_base_sha")!=os.environ["ACCEPTED_V08_BASE"] or e.get("candidate_sha")!=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip() or e.get("attack_matrix_count")!=36 or e.get("red_baseline_count")!=16 or e.get("red_ids")!=reds: raise SystemExit("EVIDENCE_BINDING_FAIL")
                    crown={r["test_id"]:r for r in rows if r["test_id"] in {"V09-R19","V09-R20","V09-R21","V09-R22","V09-R23","V09-R24"}}
                    if crown["V09-R19"].get("matched") is not True or crown["V09-R19"].get("observed_outcome")!="OUTCOME_UNKNOWN" or crown["V09-R19"].get("external_effect_count")!=1: raise SystemExit("CROWN_R19_FAIL")
                    for cid in ("V09-R20","V09-R21","V09-R22","V09-R23","V09-R24"):
                      if crown[cid].get("matched") is True: raise SystemExit(f"CROWN_RED_FAIL:{cid}")
                    print("STRUCTURAL_EVIDENCE_GATE=PASS")
                    print("FORMAL_RED_BASELINE_COUNT=16")
                    PY
                - name: Publish formal RED Evidence
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: v09-formal-authority-effect-red-evidence
                    path: v09-evidence
                    if-no-files-found: error
                    retention-days: 14
          YAML

          git add .github/workflows/v09-authority-effect-verify.yml
          git commit --amend --no-edit
          echo "LOCAL_SOURCE=$(git rev-parse HEAD)"

      - name: Validate source before export
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${ACCEPTED_V08_BASE}" HEAD
          if git merge-base --is-ancestor "${SPECULATIVE_BASE}" HEAD; then exit 1; fi
          python -m compileall -q runtime
          git diff --check "${ACCEPTED_V08_BASE}..HEAD"
          mkdir -p v09-evidence
          python runtime/test_v09_attack_matrix_offline.py --emit-jsonl v09-evidence/v09-attack-results.jsonl
          set +e
          python runtime/v09_authority_effect_evidence.py --base-sha "${ACCEPTED_V08_BASE}" --candidate-sha "$(git rev-parse HEAD)" --output v09-evidence/v09-authority-effect-evidence.json
          rc=$?
          set -e
          if test "$rc" -eq 0; then echo "UNEXPECTED_GREEN_EVIDENCE"; exit 1; fi
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          ids=[f"V09-R{i:02d}" for i in range(1,37)]
          reds=["V09-R01","V09-R04","V09-R06","V09-R08","V09-R09","V09-R13","V09-R18","V09-R20","V09-R21","V09-R22","V09-R23","V09-R24","V09-R26","V09-R32","V09-R34","V09-R36"]
          m=json.loads(Path("runtime/fixtures/v09_authority_effect_attack_cases.json").read_text(encoding="utf-8"))
          if m.get("attack_matrix_version")!="V09-AUTHORITY-EFFECT-ATTACK-MATRIX-1" or m.get("attack_case_count")!=36 or [c.get("id") for c in m.get("cases",[])]!=ids: raise SystemExit("MATRIX_FAIL")
          rows=[json.loads(x) for x in Path("v09-evidence/v09-attack-results.jsonl").read_text(encoding="utf-8").splitlines() if x]
          if [r.get("test_id") for r in rows]!=ids or [r["test_id"] for r in rows if r.get("matched") is not True]!=reds: raise SystemExit("RED_BASELINE_FAIL")
          e=json.loads(Path("v09-evidence/v09-authority-effect-evidence.json").read_text(encoding="utf-8"))
          if e.get("red_baseline_count")!=16 or e.get("red_ids")!=reds or e.get("accepted_v08_base_sha")!=os.environ["ACCEPTED_V08_BASE"] or e.get("candidate_sha")!=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(): raise SystemExit("EVIDENCE_FAIL")
          print("SOURCE_EXPORT_GATE=PASS")
          PY

      - name: Export validated four-path source bundle
        uses: actions/upload-artifact@v4
        with:
          name: v09-b2-formal-source-bundle
          path: |
            .github/workflows/v09-authority-effect-verify.yml
            runtime/fixtures/v09_authority_effect_attack_cases.json
            runtime/test_v09_attack_matrix_offline.py
            runtime/v09_authority_effect_evidence.py
          if-no-files-found: error
          retention-days: 14

      - name: Export matching formal RED Evidence
        uses: actions/upload-artifact@v4
        with:
          name: v09-b2-formal-source-evidence
          path: v09-evidence
          if-no-files-found: error
          retention-days: 14
